# ST-Link V2 (or compatible clone) + STM32F401RCT6.
# Usage once the board is connected via ST-Link:
#   openocd -f openocd.cfg -c "program build/blink.bin 0x08004000 verify reset exit"
#
# The 0x08004000 address is NOT a mistake -- this board's first 16KB of
# Flash (0x08000000-0x08003FFF) holds WeAct Studio's pre-flashed HID
# bootloader (see PRD.md Phase 1.5). Flashing at 0x08004000 keeps that
# sector untouched: OpenOCD's `program` command only erases/writes the
# Flash sectors overlapping the target address range, and on this chip
# 0x08004000 falls in Sector 1, a separate sector from Sector 0 (the
# bootloader) -- so this preserves the USB DFU-free recovery path even
# though we're not currently using it to flash (see PRD.md for why we
# switched to ST-Link instead of the HID bootloader tool).

source [find interface/stlink.cfg]
source [find target/stm32f4x.cfg]

# Slower adapter speed than the default -- prioritizes reliability over
# flash speed for a board/cable combination we haven't validated yet.
# Safe to raise once flashing is confirmed working.
adapter speed 1000
